name: Attach Macro Deck package to GitHub Release

on:
  workflow_run:
    workflows:
      - Publish Plugin to Macro Deck
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: "Successful publish workflow run ID"
        required: true
        type: string
      tag:
        description: "GitHub Release tag to receive the package"
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  attach:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download Macro Deck package artifact
        uses: actions/download-artifact@v4
        with:
          name: com.cjhackeryt.steelseriessonar-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_branch }}.macroDeckPlugin
          path: package
          run-id: ${{ github.event_name == 'workflow_dispatch' && inputs.run_id || github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Attach package to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_branch }}
        shell: bash
        run: |
          set -euo pipefail
          package="$(find package -type f -name '*.macroDeckPlugin' -print -quit)"
          test -n "$package"
          gh release upload "$TAG" "$package" --repo "$GITHUB_REPOSITORY" --clobber
